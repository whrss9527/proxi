name: 功能建议 / Feature request
description: 想要一个新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: 想要什么 / What you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么 / Why
      description: 用在什么场景，现在怎么凑合 / When you'd use it and what you do today
