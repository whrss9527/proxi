name: ci

# 编译产物只有一份，系统、更新和扩展检查在独立 runner 上并行运行。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scripts:
    name: CI 脚本检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查脚本和轮询
        run: bash Scripts/ci/check-scripts.sh

  build:
    name: 编译和单元测试
    needs: scripts
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode
        run: bash Scripts/ci/select-xcode.sh
      - name: 检查翻译
        run: python3 Scripts/check-localization.py
      - name: 检查公开的文字
        run: bash Scripts/ci/check-public.sh
      - name: 编译
        run: bash Scripts/ci/build.sh
      - name: 安装 fish
        run: bash Scripts/ci/install-fish.sh
      - name: 单元测试
        run: bash Scripts/ci/test.sh
      - name: 打包和检查产物
        run: bash Scripts/ci/package.sh
      - name: 编译窗口等待工具
        run: bash Scripts/ci/build-tools.sh
      - name: 保留文件权限和符号链接
        run: bash Scripts/ci/archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}/proxi-ci-dist.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-build-logs
          path: |
            ${{ runner.temp }}/build*.log
            ${{ runner.temp }}/test*.log
            screenshots/

  smoke:
    name: 中英文冒烟（${{ matrix.language }}）
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [zh, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: 冒烟和截图
        run: bash Scripts/ci/smoke-${{ matrix.language }}.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-smoke-${{ matrix.language }}
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  migration:
    name: 旧配置迁移
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: migration-config
        run: bash Scripts/ci/migration-config.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-migration
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  update:
    name: 一键更新
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: update-e2e
        run: bash Scripts/ci/update-e2e.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-update
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  rename:
    name: 改名前版本更新
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: rename-e2e
        run: bash Scripts/ci/rename-e2e.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-rename
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  signing:
    name: 签名流程自测
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 选择 Xcode
        run: bash Scripts/ci/select-xcode.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: signing-selftest
        run: bash Scripts/ci/signing-selftest.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-signing
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  extension:
    name: 扩展端到端
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxi-ci-dist
          path: ${{ runner.temp }}
      - name: 还原产物
        run: bash Scripts/ci/unpack.sh
      - name: 准备独立测试环境
        run: bash Scripts/ci/prepare.sh
      - name: migration-config
        run: bash Scripts/ci/migration-config.sh
      - name: extension-e2e
        run: bash Scripts/ci/extension-e2e.sh
      - name: 收集诊断和截图
        if: always()
        run: bash Scripts/ci/report.sh
      - name: 清理测试进程与钥匙串
        if: always()
        run: bash Scripts/ci/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-ci-extension
          path: |
            screenshots/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*-status.json
            ${{ runner.temp }}/status-last.json
            ${{ runner.temp }}/fixture-requests*.jsonl
          retention-days: 7

  macos:
    # 保留原有检查名字，分支保护和自动合并继续等全部检查成功。
    name: 编译、测试、打包
    needs: [scripts, build, smoke, migration, update, rename, signing, extension]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: 检查全部结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 Scripts/ci/check-results.py

  auto-merge:
    name: 自动合并
    needs: macos
    # 本仓库分支上开的、合进 main 的合并请求（fork 来的和草稿除外），测试通过就合并。
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: 合并
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: bash Scripts/ci/auto-merge.sh

  plan-release:
    name: 看要不要发版
    needs: [macos, auto-merge]
    # 刚自动合并进 main，或者直接推到 main 且测试通过。
    if: >-
      !cancelled() && needs.macos.result == 'success' &&
      (needs.auto-merge.outputs.sha != '' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-merge.outputs.sha || github.sha }}
      - name: 读 CHANGELOG.md 最上面的版本
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci/plan-release.sh

  release:
    name: 发布新版本
    needs: plan-release
    # plan-release 往上的「自动合并」在直接推到 main 时是 skipped，不加 !cancelled() 的话
    # 默认的 success() 会因为上游有 skipped 的任务把这一步一起跳过，标签就打不出来。
    if: ${{ !cancelled() && needs.plan-release.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan-release.outputs.tag }}
      ref: ${{ needs.plan-release.outputs.sha }}
    secrets: inherit

