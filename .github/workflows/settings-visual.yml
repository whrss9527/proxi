name: settings-visual
on:
  push:
    branches: [fix/settings-handoff-compositing]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/ci/select-xcode.sh
      - name: Download released apps for baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download v0.16.5 --repo "$GITHUB_REPOSITORY" -p Proxi-macos-arm64.zip -p Proxi-Engine-0.16.5.zip -p SHA256SUMS.txt -D dist
          (cd dist && shasum -a 256 --ignore-missing -c SHA256SUMS.txt)
          ditto -x -k dist/Proxi-macos-arm64.zip dist
          ditto -x -k dist/Proxi-Engine-0.16.5.zip dist
      - name: Observe real sidebar handoff
        run: bash Scripts/ci/settings-visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-visual
          path: |
            screenshots/
            ${{ runner.temp }}/settings-visual.log
