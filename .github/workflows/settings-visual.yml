name: settings-visual
on:
  push:
    branches: [fix/settings-handoff-compositing]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/ci/select-xcode.sh
      - uses: actions/cache@v4
        with:
          path: .build
          key: settings-visual-26-${{ github.sha }}
          restore-keys: settings-visual-26-
      - name: Build candidate apps
        run: VERSION=0.0.0 ARCHS= CONFIG=debug bash Scripts/build-app.sh
      - name: Test window layout
        run: swift test --filter 'Settings(Window|Page)'
      - name: Verify layer-backed cover on screen
        run: |
          swiftc -parse-as-library Sources/Proxi/UI/SettingsWindowHandoff.swift Scripts/ci/check-handoff-layer.swift -o "$RUNNER_TEMP/check-handoff-layer"
          "$RUNNER_TEMP/check-handoff-layer"
      - name: Observe real sidebar handoff
        run: bash Scripts/ci/settings-visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-visual
          path: |
            screenshots/
            ${{ runner.temp }}/settings-visual.log
