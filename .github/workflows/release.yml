name: release

# 构建/共同公证 → 两种芯片下载同一候选 ZIP 验证 → 公开；任何门禁失败都不发布。
# dry_run 只生成候选归档与验证回执，不创建标签或 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "未发布的版本标签，例如 v0.17.0；不能覆盖已公开版本"
        required: true
        type: string
      dry_run:
        description: "只正式签名、公证并验证候选包，不创建标签或 Release"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 覆盖整个流水线，避免另一个版本在两个验证 job 之间开始发布。
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: 签名与共同公证
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: 确认候选版本和源码
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::版本标签格式不对"; exit 1; }
          state=$(python3 Scripts/ci/release-state.py "$GITHUB_REPOSITORY" "$TAG")
          if [ "$state" = "published" ]; then
            echo "::error::$TAG 已公开，禁止覆盖附件"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "::error::标签与候选源码不同"; exit 1; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 选择 Xcode
        run: bash Scripts/ci/select-xcode.sh
      - name: 单元测试
        run: swift test
      - name: 导入 Developer ID 证书
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICATE_P12_BASE64" ] || { echo "::error::未配置 Developer ID 证书，不能验证正式发行包"; exit 1; }
          Scripts/import-certificate.sh
      - name: 打包通用和精简归档
        run: VERSION="${TAG#v}" THIN_ARCHIVES=1 Scripts/build-app.sh
      - name: 共同公证、钉票据并验证最终 ZIP
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: Scripts/notarize.sh dist/Proxi-macos.zip dist/Proxi-macos-arm64.zip dist/Proxi-macos-x86_64.zip "dist/Proxi-Engine-${TAG#v}.zip"
      - name: 固定候选附件及摘要
        run: |
          for suffix in "" -arm64 -x86_64; do cp "dist/Proxi-macos${suffix}.zip" "dist/ProxySwitch-macos${suffix}.zip"; done
          (cd dist && shasum -a 256 Proxi-macos.zip Proxi-macos-arm64.zip Proxi-macos-x86_64.zip ProxySwitch-macos.zip ProxySwitch-macos-arm64.zip ProxySwitch-macos-x86_64.zip "Proxi-Engine-${TAG#v}.zip" > SHA256SUMS.txt)
          team=$(codesign -dvv dist/Proxi.app 2>&1 | sed -n 's/^TeamIdentifier=//p')
          python3 Scripts/ci/release-integrity.py candidate --directory dist --tag "$TAG" --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --team-id "$team"
      - uses: actions/upload-artifact@v4
        with:
          name: proxi-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: 删除临时钥匙串
        if: always() && env.CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$CODESIGN_KEYCHAIN" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxi-notary-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proxi-notary.*/submit.json
            ${{ runner.temp }}/proxi-notary.*/wait.json
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: 下载验证（${{ matrix.architecture }}）
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: proxi-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: 验证最终附件的签名、票据和 Gatekeeper
        env:
          RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_RECEIPTS_DIR: ${{ runner.temp }}/release-receipts
        run: bash Scripts/ci/verify-release-archives.sh candidate "${TAG#v}" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: proxi-release-receipt-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipts/${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 公开已验证附件
    needs: [build, verify]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: proxi-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: proxi-release-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          merge-multiple: true
      - name: 核对两架构回执并公开
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: bash Scripts/ci/publish-release.sh candidate receipts
